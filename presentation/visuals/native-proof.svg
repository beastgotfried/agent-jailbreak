  <g id="text_13">
   <text style="fill: #161616; font: 600 29px 'IBM Plex Sans'; text-anchor: start" x="63.36" y="56.516094" transform="rotate(-0 63.36 56.516094)">Native. Offline. Reproducible.</text>
  </g>
  <g id="text_14">
   <text style="fill: #525252; font: 14px 'IBM Plex Sans'; text-anchor: start" x="63.36" y="84.78" transform="rotate(-0 63.36 84.78)">The full selected workflow executes on IBM LinuxONE s390x CPUs</text>
  </g>
  <g id="text_15">
   <text style="fill: #0f62fe; font: 600 18px 'IBM Plex Sans'; text-anchor: start" x="86.4" y="171.72" transform="rotate(-0 86.4 171.72)">Linux s390x  ·  Big-endian  ·  CPU-only  ·  Two-CPU quota / 4 GiB container limit</text>
  </g>
  <g id="text_16">
   <text style="fill: #161616; font: 600 26px 'IBM Plex Sans'; text-anchor: start" x="86.4" y="486" transform="rotate(-0 86.4 486)">292 native tests pass</text>
  </g>
  <g id="text_17">
   <text style="fill: #161616; font: 600 26px 'IBM Plex Sans'; text-anchor: start" x="656.64" y="486" transform="rotate(-0 656.64 486)">Fresh offline container</text>
  </g>
  <g id="text_18">
   <text style="fill: #525252; font: 13px 'IBM Plex Sans'; text-anchor: start" x="86.4" y="518.4" transform="rotate(-0 86.4 518.4)">Four optional PyArrow converter tests skip.</text>
  </g>
  <g id="text_19">
   <text style="fill: #525252; font: 13px 'IBM Plex Sans'; text-anchor: start" x="656.64" y="518.4" transform="rotate(-0 656.64 518.4)">Data, learned state, scores and decisions match.</text>
  </g>
  <g id="text_20">
   <text style="fill: #525252; font: 13px 'IBM Plex Sans'; text-anchor: start" x="86.4" y="573.48" transform="rotate(-0 86.4 573.48)">Highest study child-process peak RSS: 923.84 MiB. This is an experimental resource profile, not enterprise capacity.</text>
  </g>
  <g id="text_21">
   <text style="fill: #525252; font: 12px 'IBM Plex Sans'; text-anchor: start" x="86.4" y="599.4" transform="rotate(-0 86.4 599.4)">Native CPU verification does not imply Telum/Spyre acceleration, hardware attestation, or IBM certification.</text>
  </g>
  <g id="text_22">
